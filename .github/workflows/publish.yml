name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VSIX=github-codesearch-$version.vsix" >> "$GITHUB_ENV"
      - run: npm run lint

      # The Marketplace "Changelog" tab shows the packaged CHANGELOG.md, built here from the
      # GitHub release notes (including this tag's, generated if its release doesn't exist yet).
      - name: Generate CHANGELOG.md from GitHub releases
        run: |
          notes='gsub("\r"; "") | sub("^## \\[[^\n]*\n+"; "") | gsub("(?<s>^|\n)## "; "\(.s)### ")'
          {
            echo "# Changelog"
            if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              printf '\n## %s - %s\n\n' "$GITHUB_REF_NAME" "$(date -u +%F)"
              gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq ".body | $notes"
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.draft | not) | \"\n## \(.tag_name) - \(.published_at[:10])\n\n\(.body | $notes)\""
          } > CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}

      - run: npx @vscode/vsce@3 package -o "$VSIX"

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce@3 publish --packagePath "$VSIX" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx@1 publish "$VSIX" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach VSIX to GitHub release
        run: |
          gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$VSIX" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
