name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Open VSX trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VSIX=github-codesearch-$version.vsix" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npx @vscode/vsce@3 package -o "$VSIX"

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce@3 publish --packagePath "$VSIX" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx@1 publish "$VSIX" --skip-duplicate --trusted-publishing

      - name: Attach VSIX to GitHub release
        run: |
          gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$VSIX" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
